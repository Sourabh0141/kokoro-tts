# =============================================================================
# Docker Compose for Streamlit Frontend
# =============================================================================
#
# This file defines the Docker Compose configuration for running the Streamlit
# frontend of the Kokoro TTS application.
#
# It defines a single service:
#   - streamlit-frontend: The Streamlit application container.
#
# To use this, you must have the backend service running and on the same
# Docker network. This configuration assumes the backend is running on a

# network named 'kokoro-tts-network'.
#
# =============================================================================

version: '3.8'

services:
  streamlit-frontend:
    # Build the Docker image from the Dockerfile in the current directory
    build:
      context: .
      dockerfile: Dockerfile
    
    # Name the container for easy identification
    container_name: kokoro-tts-streamlit
    
    # Map the container's port 8501 to the host's port 8501
    ports:
      - "8501:8501"
      
    # Load environment variables from the .env file
    env_file:
      - .env
      
    # Attach the container to the backend network
    # This allows the Streamlit app to communicate with the FastAPI service
    # using the service name as the hostname (e.g., http://kokoro-tts-backend:8880)
    networks:
      - kokoro-tts-network

networks:
  kokoro-tts-network:
    # This configuration assumes the network is created externally
    # (e.g., by the main application's docker-compose.yml)
    external: true
