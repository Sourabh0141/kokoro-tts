# =============================================================================
# Kokoro TTS Service - Docker Compose Configuration
# =============================================================================
# Docker Compose orchestration for the Kokoro text-to-speech service.
# Defines container configuration, networking, volumes, and health monitoring.

services:
  # Main TTS service container (Backend)
  tts-service:
    # Build the container image from the backend directory
    build: ./backend

    # Port mapping: Expose container port 8880 to host port 8880
    # Allows external access to the FastAPI web service
    ports:
      - "8880:8880"

    # Volume mounts for persistent data and development workflow
    volumes:
      # Mount models directory as read-only for model and voice files
      - ./backend/models:/app/models:ro
      # Mount application code for development hot-reloading
      - ./backend/app:/app/app

    # Environment variables for service configuration
    env_file:
      - ./backend/.env

    environment:
      # Python path configuration for module imports
      - PYTHONPATH=/app
      # MeCab configuration for Japanese text processing
      - MECABRC=/usr/local/lib/python3.11/site-packages/unidic/dicdir/mecabrc

    # Restart policy: Automatically restart unless manually stopped
    restart: unless-stopped

    # Health check configuration for container monitoring
    healthcheck:
      test: "curl -f http://localhost:${SERVICE__PORT:-8880}/v1/health || exit 1"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - kokoro-network

  # Streamlit frontend service
  streamlit-frontend:
    # Build the Docker image from the frontend directory
    build:
      context: ./frontend
      dockerfile: Dockerfile
    
    # Name the container for easy identification
    container_name: kokoro-tts-streamlit
    
    # Map the container's port 8501 to the host's port 8501
    ports:
      - "8501:8501"
      
    # Load environment variables from the frontend .env file
    env_file:
      - ./frontend/.env
      
    # Attach the container to the shared network
    networks:
      - kokoro-network
    
    # Ensure backend is started first
    depends_on:
      - tts-service

networks:
  kokoro-network:
    driver: bridge
