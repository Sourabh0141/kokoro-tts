services:
  tts-service:
    build: .
    ports:
      - "8880:8880"
    volumes:
      - ./models:/app/models:ro
      - ./app:/app/app
    environment:
      - SERVICE__PORT=8880
      - SERVICE__HOST=0.0.0.0
      - PYTHONPATH=/app
      - MECABRC=/usr/local/lib/python3.11/site-packages/unidic/dicdir/mecabrc
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8880/health", "||", "exit", "1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
